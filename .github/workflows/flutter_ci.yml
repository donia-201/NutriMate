name: Flutter CI Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  flutter-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code (Linting & Errors)
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test
          